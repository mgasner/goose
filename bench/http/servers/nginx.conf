# nginx for the serving suite (bench/http/design.md). http_bench.py fills in
# {workers}, {port}, {dir} and {reuseport}, and runs `nginx -p {dir} -c
# nginx.conf`. reuseport is on for Linux only: on macOS SO_REUSEPORT hands
# every connection to one socket, so one worker would do all the work; there
# the workers share one listening socket, as the Goose and libuv servers do.
# /json is a fixed string here rather than serialized per request, and
# nginx has no /echo; its own Server header and Connection: keep-alive make
# its responses a few bytes longer than the others'.

daemon off;
master_process on;
worker_processes {workers};
pid {dir}/nginx.pid;
error_log {dir}/nginx_error.log warn;

events {{
    worker_connections 16384;
    multi_accept on;
}}

http {{
    access_log off;
    server_tokens off;
    keepalive_requests 100000000;
    keepalive_timeout 65;
    tcp_nodelay on;
    sendfile on;

    server {{
        listen 127.0.0.1:{port}{reuseport} backlog=4096;

        location = /plaintext {{
            default_type text/plain;
            return 200 "Hello, World!";
        }}
        location = /json {{
            default_type application/json;
            return 200 '{{"message":"Hello, World!"}}';
        }}
        location /bytes/ {{
            root {dir}/www;
            default_type application/octet-stream;
        }}
    }}
}}
